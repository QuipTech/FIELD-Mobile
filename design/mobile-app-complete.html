\"c3\"><\u002Fi><i class=\"c4\"><\u002Fi><i class=\"scanline\"><\u002Fi><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"col\" style=\"gap:4px\"><span class=\"t b\">Scan sweep + match<\u002Fspan><span class=\"cap\">Line sweeps 1.8 s loop · on match frame turns green + success haptic<\u002Fspan><span class=\"mono\">RN: expo-camera onBarcodeScanned + expo-haptics notificationAsync(Success)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"mt\"><div class=\"mstage\"><div style=\"position:absolute;inset:14px;border-radius:10px;background:var(--card);border:1px solid var(--bd);padding:12px;display:flex;flex-direction:column;gap:8px\"><div class=\"sk\" style=\"height:10px;width:60%;animation:none\"><\u002Fdiv><div class=\"sk\" style=\"height:10px;width:85%;animation:none\"><\u002Fdiv><div class=\"sk\" style=\"height:10px;width:40%;animation:none\"><\u002Fdiv><\u002Fdiv><div class=\"m-toast\" style=\"position:absolute;left:24px;right:24px;top:10px;height:40px;border-radius:12px;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:8px;padding:0 12px;font:500 13px 'IBM Plex Sans',sans-serif\"><svg class=\"ic ic-s\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg>Entry saved<\u002Fdiv><\u002Fdiv><div class=\"col\" style=\"gap:4px\"><span class=\"t b\">Toast<\u002Fspan><span class=\"cap\">Saved / synced confirmations · drops 200 ms, holds 2.5 s, lifts<\u002Fspan><span class=\"mono\">RN: Reanimated SlideInUp / SlideOutUp, layout in safe area<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"mt\"><div class=\"mstage\"><div style=\"position:absolute;inset:14px;border-radius:10px;background:var(--card);border:1px solid var(--bd);padding:12px;display:flex;flex-direction:column;gap:8px\"><div class=\"sk\" style=\"height:10px;width:60%;animation:none\"><\u002Fdiv><div class=\"sk\" style=\"height:10px;width:85%;animation:none\"><\u002Fdiv><div class=\"sk\" style=\"height:10px;width:40%;animation:none\"><\u002Fdiv><\u002Fdiv><div class=\"m-banner\" style=\"position:absolute;left:0;right:0;top:0;height:36px;background:var(--am-t);color:var(--am);display:flex;align-items:center;gap:8px;padding:0 14px;font:600 13px 'IBM Plex Sans',sans-serif\"><svg class=\"ic ic-s\"><use href=\"#i-wifioff\"><\u002Fuse><\u002Fsvg>You're offline<\u002Fdiv><\u002Fdiv><div class=\"col\" style=\"gap:4px\"><span class=\"t b\">Offline banner<\u002Fspan><span class=\"cap\">Connection lost / back · slides in 200 ms, auto-hides 2 s after reconnect<\u002Fspan><span class=\"mono\">RN: NetInfo listener → banner height withTiming<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"mt\"><div class=\"mstage\"><div style=\"position:absolute;inset:16px;display:flex;flex-direction:column;gap:10px;justify-content:center\"><span class=\"row cap\" style=\"gap:8px;color:var(--am)\"><svg class=\"ic spin\"><use href=\"#i-refresh\"><\u002Fuse><\u002Fsvg>Uploading 2 items…<\u002Fspan><span class=\"row cap\" style=\"gap:8px;color:var(--gn)\"><svg class=\"ic \"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg>All synced<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"col\" style=\"gap:4px\"><span class=\"t b\">Sync spinner<\u002Fspan><span class=\"cap\">Pending sync rows / outbox · 1 s rotation, stops with a check<\u002Fspan><span class=\"mono\">RN: withRepeat(withTiming(360, { duration: 1000, easing: linear }))<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"mt\"><div class=\"mstage\"><div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center\"><span class=\"btn p m-press\" style=\"min-width:170px;justify-content:flex-start\">Save entry<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"col\" style=\"gap:4px\"><span class=\"t b\">Press feedback<\u002Fspan><span class=\"cap\">Every button / row · scale 0.97 + tint on press, 90 ms<\u002Fspan><span class=\"mono\">RN: Pressable + useAnimatedStyle; light haptic on primary actions<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"mt\"><div class=\"mstage\"><div style=\"position:absolute;left:0;right:0;bottom:0;height:64px;border-top:1px solid var(--bd);background:var(--card);display:flex;justify-content:space-around;align-items:center\"><span class=\"tab\"><svg class=\"ic ic-l\"><use href=\"#i-home\"><\u002Fuse><\u002Fsvg><\u002Fspan><span class=\"tab on\"><svg class=\"ic ic-l m-pop\"><use href=\"#i-book\"><\u002Fuse><\u002Fsvg><\u002Fspan><span class=\"tab\"><svg class=\"ic ic-l\"><use href=\"#i-spark\"><\u002Fuse><\u002Fsvg><\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"col\" style=\"gap:4px\"><span class=\"t b\">Tab switch<\u002Fspan><span class=\"cap\">Active tab icon pops 1 → 1.15 → 1 · 180 ms; screens cross-fade<\u002Fspan><span class=\"mono\">RN: tabBarIcon with withSequence(withSpring)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"mt\"><div class=\"mstage\"><div style=\"position:absolute;inset:24px;display:flex;flex-direction:column;gap:10px;justify-content:center\"><span class=\"cap\" style=\"color:var(--ink)\">142 of 500 queries<\u002Fspan><div class=\"meter\"><i class=\"mfill m-fill\"><\u002Fi><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"col\" style=\"gap:4px\"><span class=\"t b\">Usage meter<\u002Fspan><span class=\"cap\">AI allowance / storage meters fill on first view · 600 ms ease-out<\u002Fspan><span class=\"mono\">RN: width withTiming on mount (skip if reduced motion)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"mt\" style=\"width:620px\"><div class=\"card\" style=\"padding:20px;display:flex;flex-direction:column;gap:10px\"><span class=\"t b\">Rules<\u002Fspan><span class=\"t\" style=\"font-size:14px;line-height:1.55\">Durations: 90 ms press · 200 ms small · 240 ms navigation · 320 ms sheets. Nothing on a critical path runs longer than 400 ms.<br>Easing: standard (0.2, 0, 0, 1); springs only for sheets and the tab icon.<br>Reduce motion (AccessibilityInfo.isReduceMotionEnabled): replace movement with a 150 ms fade, stop loops except the sync spinner.<br>Haptics: success on scan match and save, warning on validation error, none on scroll.<br>Library: react-native-reanimated 3 + @gorhom/bottom-sheet; no Lottie needed for v1.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Both&quot;,&quot;Customer&quot;,&quot;Admin&quot;],&quot;default&quot;:&quot;Both&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;modes&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Both&quot;,&quot;Light&quot;,&quot;Dark&quot;],&quot;default&quot;:&quot;Light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;brandLayout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Grid&quot;,&quot;List&quot;],&quot;default&quot;:&quot;Grid&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const show = this.props.modes ?? 'Light';\n    const role = this.props.role ?? 'Both';\n    const themes = [{ t: 'l', cls: '', name: 'Light' }, { t: 'd', cls: 'dk', name: 'Dark' }]\n      .filter(x => show === 'Both' || x.name === show);\n    const roles = [\n      { r: 'c', name: 'Customer', admin: false, sub: 'Technician view — only live documents in brands their company can access.' },\n      { r: 'a', name: 'Admin', admin: true, sub: 'Same screens and routes; admin-only items render when role = admin (review queue, status, access, document actions).' }\n    ].filter(x => role === 'Both' || x.name === role);\n    const modes = [];\n    roles.forEach(r => themes.forEach(t => modes.push({\n      k: r.r + t.t, cls: t.cls, badge: (r.r + t.t).toUpperCase(),\n      label: r.name + ' · ' + t.name + ' mode', sub: r.sub, admin: r.admin, cust: !r.admin\n    })));\n    const grid = (this.props.brandLayout ?? 'Grid') === 'Grid';\n    return { modes, isGrid: grid, isList: !grid };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
